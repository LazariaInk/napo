services:
  postgres:
    image: postgres:17
    container_name: napo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: napo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - napo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d napo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  napo_postgres_data:
