spring.datasource.url=${NAPO_DATASOURCE_URL:jdbc:postgresql://localhost:55432/napo}
spring.datasource.username=${NAPO_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${NAPO_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4.1-mini
spring.ai.openai.chat.temperature=0.1
spring.ai.openai.chat.max-completion-tokens=500

napo.jwt.secret=${NAPO_JWT_SECRET:local-development-secret-change-before-production-123456}
napo.jwt.issuer=${NAPO_JWT_ISSUER:napo-api}
napo.jwt.ttl-minutes=${NAPO_JWT_TTL_MINUTES:1440}

napo.google.allowed-client-ids=${NAPO_GOOGLE_ALLOWED_CLIENT_IDS:}
